theme = "molokai"

[editor]
line-number = "relative"
mouse = false
true-color = true
cursorline = true
end-of-line-diagnostics = "hint"

[keys.normal]
esc = ["collapse_selection", "keep_primary_selection"]

[editor.lsp]
display-inlay-hints = true

[editor.whitespace]
render = "none"

[editor.inline-diagnostics]
cursor-line = "warning"

[keys.normal."space"]
o = "file_picker_in_current_buffer_directory"
